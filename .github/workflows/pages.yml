name: Publish site
# Builds the public site from Acronis. Secrets stay in GitHub Actions, not in the repo.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography
      - run: python build_site.py
        env:
          ACRONIS_CLIENT_ID: ${{ secrets.ACRONIS_CLIENT_ID }}
          ACRONIS_CLIENT_SECRET: ${{ secrets.ACRONIS_CLIENT_SECRET }}
          ACRONIS_DC_URL: ${{ secrets.ACRONIS_DC_URL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
